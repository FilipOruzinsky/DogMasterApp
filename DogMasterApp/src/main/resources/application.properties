dog.master.realm=DogMasterApp-realm
server.port=8081
spring.application.name=DogMasterApp
spring.datasource.url=jdbc:postgresql://localhost:5436/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=true
spring.profiles.active=default

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=8081
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/${dog.master.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/${dog.master.realm}/protocol/openid-connect/certs